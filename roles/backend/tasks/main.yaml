- name: disable nodejs
  ansible.builtin.package:
      name: nodejs
      state: absent
- name: disable nodejs
  ansible.builtin.package:
    name: nodejs
    state: absent

- name: enable nodejs
  ansible.builtin.command: " dnf module enable nodejs:20 -y "

- name: install nodejs
  ansible.builtin.package:
     name: "{{ item }}"
     state: present
  loop:
  - nodejs
  - mysql

- name: install libraries
  ansible.builtin.pip:
    name: PyMySQL
    executable: pip3.9
    

- name: set user
  ansible.builtin.user:
    name: expense

- name: create a directroy
  ansible.builtin.file:
    path: /app
    state: directory

- name: download file
  ansible.builtin.get_url:
    url: https://expense-builds.s3.us-east-1.amazonaws.com/expense-backend-v2.zip
    dest: /tmp/backend.zip

- name: unzip file
  ansible.builtin.unarchive:
    src: /tmp/backend.zip
    dest: /app
    remote_src: yes

- name: install npm package
  community.general.npm:
    path: /app

- name: copy file backend
  ansible.builtin.template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    
- name: improt mysql database
  community.mysql.mysql_db:
    state: import
    name: all
    login_user: "{{ sql_user }}"
    login_password: "{{ my_sql_password }}"
    login_host: "{{ sql_host }}"
    target: /app/schema/backend.sql

- name: reload service
  ansible.builtin.systemd_service:
    enabled: true
    state: restarted
    daemon_reload: true
    name: backend