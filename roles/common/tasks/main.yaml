- name: remove directory
  ansible.builtin.file:
    path: "{{ app_location }}"
    state: absent

- name: create directory
  ansible.builtin.file:
    path: "{{ app_location }}"
    state: directory

- name:
  ansible.builtin.unarchive:
    src: "https://expense-builds.s3.us-east-1.amazonaws.com/expense-{{ common }}-v2.zip"
    dest: "{{ app_location}}"
    remote_src: yes
    